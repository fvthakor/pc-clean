[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcclean"
version = "1.0.0"
description = "Developer-focused Windows disk cleanup, storage analyzer, and safe cache management suite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PcClean Project Contributors" }
]
keywords = [
    "windows",
    "disk-cleanup",
    "storage-analyzer",
    "treesize",
    "developer-tools",
    "cache-cleaner",
    "pyside6"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities"
]
dependencies = [
    "PySide6>=6.6.0",
    "psutil>=5.9.0",
    "send2trash>=1.8.0",
    "Pillow>=10.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "bandit>=1.7.0",
    "pyinstaller>=6.0.0"
]

[project.urls]
Homepage = "https://github.com/fvthakor/pc-clean"
Documentation = "https://github.com/fvthakor/pc-clean/tree/master/docs"
Repository = "https://github.com/fvthakor/pc-clean.git"
Issues = "https://github.com/fvthakor/pc-clean/issues"
Changelog = "https://github.com/fvthakor/pc-clean/blob/master/CHANGELOG.md"

[project.scripts]
pcclean = "pcclean.cli:run_cli"
pcclean-gui = "main:main"
winclean = "pcclean.cli:run_cli"

[tool.setuptools.packages.find]
include = ["app*", "database*", "models*", "services*", "ui*", "utils*", "pcclean*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "resources",
    "__pycache__"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP"   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "E722",  # do not use bare 'except'
    "B904"   # raise ... from err
]

[tool.ruff.lint.isort]
known-first-party = ["app", "database", "models", "services", "ui", "utils", "pcclean"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.coverage.run]
source = ["app", "database", "models", "services", "utils", "pcclean"]
omit = [
    "tests/*",
    "build/*",
    "dist/*",
    "ui/*"  # GUI widgets tested via integration
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass"
]
show_missing = true
